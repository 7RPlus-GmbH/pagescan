# Publish pagescan to PyPI on version-tag push.
#
# Uses PyPI's OIDC trusted publishing — no API tokens, no long-lived secrets.
# The matching pending publisher is configured at
# https://pypi.org/manage/account/publishing/ with:
#
#     PyPI project name:   pagescan
#     Owner:               7RPlus-GmbH
#     Repository name:     pagescan
#     Workflow filename:   workflow.yml         <- this file
#     Environment name:    pagescan             <- declared below in the publish job
#
# To release:
#     git tag v0.1.0
#     git push origin v0.1.0
#
# The "pagescan" environment must also exist under
# Settings -> Environments in the GitHub repo (created automatically the first
# time this workflow runs, or set up in advance with required reviewers).
#
# A separate CI workflow (PLAN.md week 5) covers per-PR test + lint + matrix
# build. This file only handles releases.
name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so version-detection tools work

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pagescan-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pagescan
      url: https://pypi.org/project/pagescan/
    permissions:
      id-token: write    # required for OIDC trusted publishing
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: pagescan-dist
          path: dist/

      - name: Publish to PyPI
        # No `password` / `user` inputs — auth comes from the OIDC token,
        # exchanged for a short-lived upload token by PyPI.
        uses: pypa/gh-action-pypi-publish@release/v1
